name: Free Tier CI Pipeline

on:
  push:
    branches: [ main, veeresh ]
  pull_request:
    branches: [ main, veeresh ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lightweight Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Memory & Start Backend
        run: |
          python -c "
          import os, psutil
          print('Pre-launch Memory RSS (MB):', round(psutil.Process().memory_info().rss / (1024*1024), 2))
          "
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          sleep 4

      - name: Run Integration Tests
        run: |
          python backend/tests/test_endpoints.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js PWA
        working-directory: frontend
        run: npm run build
